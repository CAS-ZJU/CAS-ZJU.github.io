title: CAS ZJU
subtitle: Critical Algorithms Studies
name: Critical Algorithms Studies Cluster
email: casszju@gmail.com
description: >-
  Critical researchers and computational social scientists studying the social
  implications of algorithms and data science at Zhejiang University.
url: "https://cas-zju.github.io"
baseurl: ""
locale: en-US
timezone: Asia/Shanghai
repository: CAS-ZJU/CAS-ZJU.github.io

theme: minimal-mistakes-jekyll
minimal_mistakes_skin: default
plugins:
  - jekyll-include-cache
  - jekyll-feed

markdown: kramdown
permalink: /news/:year/:month/:day/:title/
collections:
  people:
    output: true
    permalink: /people/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: single
      classes: wide
      author_profile: false
      share: false
      related: false
  - scope:
      path: ""
      type: people
    values:
      layout: person
      classes: wide
  - scope:
      path: ""
      type: posts
    values:
      layout: single

footer:
  links:
    - label: Email
      icon: fas fa-envelope
      url: mailto:casszju@gmail.com
    - label: GitHub
      icon: fab fa-github
      url: https://github.com/CAS-ZJU

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - docs
  - scripts
  - README.md
  - resources/person
  - .DS_Store
  - .bundle
  - .github
